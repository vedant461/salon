services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salon-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"
    networks:
      - salon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: salon-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - salon-network

networks:
  salon-network:
    driver: bridge
